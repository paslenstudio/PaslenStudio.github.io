<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if page.title %}{{ page.title }} · {% endif %}paslen vibes</title>
    <link rel="icon" href="{{ '/paslen_ico.png' | relative_url }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" />
    <link rel="stylesheet" href="{{ '/assets/css/vibes.css' | relative_url }}" />
    {%- if page.alternate %}
    <link rel="alternate" type="text/plain" href="{{ page.alternate | relative_url }}" title="Plain text" />
    {%- endif %}
  </head>
  <body>
    <div class="wrap">
      <header class="brand">
        <a href="{{ '/vibes/' | relative_url }}">
          <img src="{{ '/paslen_ico.png' | relative_url }}" alt="" width="40" height="40" />
          <span>paslen <b>vibes</b></span>
        </a>
      </header>
      {{ content }}
    </div>
    <script src="{{ '/assets/js/vibes.js' | relative_url }}"></script>
  </body>
</html>
